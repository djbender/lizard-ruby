name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version:
          - '3.3'
          - '3.4'
          - '4.0'
          - 'head'

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1.291.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake test

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5.5.2
      if: matrix.ruby-version == '4.0'
      with:
        files: ./coverage/.resultset.json
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1.291.0
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Run StandardRB
      run: bin/standardrb --format progress

  ci:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
    - run: |
        if [[ "${{ needs.test.result }}" != "success" || "${{ needs.lint.result }}" != "success" ]]; then
          exit 1
        fi
